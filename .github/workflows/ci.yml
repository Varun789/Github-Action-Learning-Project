# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4  # Updated from v2

    - name: Set up JDK 8
      uses: actions/setup-java@v4 # Updated from v1 to properly support 'temurin'
      with:
        java-version: '8'
        distribution: 'temurin'

    # Enable native Gradle caching so your builds don't take forever
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew clean build -x test

    # Debugging step: Verify exactly where the JAR is generated
    - name: List built files
      run: ls -R build/libs/

    - name: Build and Push Docker Image
      uses: mr-smithers-excellent/docker-build-push@v6 # Updated from v4
      with:
        image: varunladha/java-project
        registry: docker.io
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }} 
